<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página Não Encontrada | Pat Oficial</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' width='64' height='64'%3E%3Crect width='64' height='64' rx='16' fill='%2309090b' stroke='rgba(255, 255, 255, 0.12)' stroke-width='1.5'/%3E%3Cpath d='M 24 16 L 36 16 C 43 16 47 20 47 26 C 47 32 43 36 36 36 L 30 36 L 30 48 L 24 48 Z M 30 22 L 30 30 L 35.5 30 C 39 30 41 28.5 41 26 C 41 23.5 39 22 35.5 22 Z' fill='%23ffffff'/%3E%3Ccircle cx='43' cy='44' r='3.5' fill='%232997ff'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-canvas: #000000;
      --text-primary: #f5f5f7;
      --text-secondary: #a1a1a6;
      --font-system: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-system);
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 40vh;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.05) 0%, transparent 70%);
      pointer-events: none;
    }
    .notfound-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      background: linear-gradient(180deg, #FFFFFF 20%, rgba(255, 255, 255, 0.5) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .notfound-title {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 0.75rem;
    }
    .notfound-text {
      max-width: 440px;
      margin: 0 auto 2.25rem;
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: #ffffff;
      color: #000000;
      padding: 0.85rem 1.85rem;
      border-radius: 980px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(255, 255, 255, 0.2);
      transition: all 0.2s ease;
    }
    .btn:hover {
      background: #f0f0f2;
      transform: translateY(-2px);
    }
  </style>
  <script>
    const path = window.location.pathname.toLowerCase();
    if (path.includes('sobre-mim')) {
      window.location.replace('./#sobre');
    } else if (path.includes('contato')) {
      window.location.replace('./#contato');
    }
  </script>
</head>
<body>
  <div class="notfound-code">404</div>
  <h1 class="notfound-title">Ops! Esse movimento não existe por aqui.</h1>
  <p class="notfound-text">
    A página que você estava procurando foi movida, atualizada ou não existe mais. Retorne à página principal para explorar o portfolio completo.
  </p>
  <a href="./" class="btn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="19" y1="12" x2="5" y2="12"></line>
      <polyline points="12 19 5 12 12 5"></polyline>
    </svg>
    <span>Voltar para o Início</span>
  </a>
</body>
</html>

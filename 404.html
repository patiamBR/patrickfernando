<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Página Não Encontrada | Pat Oficial</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .notfound-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      z-index: 2;
    }
    .notfound-code {
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.05em;
      margin-bottom: 0.5rem;
    }
    .notfound-text {
      max-width: 440px;
      margin: 0 auto 2.25rem;
      font-size: 1.05rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
  </style>
  <script>
    // Smooth auto-redirect for old legacy bookmarks (/sobre-mim/ or /contato/)
    const path = window.location.pathname.toLowerCase();
    if (path.includes('sobre-mim')) {
      window.location.replace('./#sobre');
    } else if (path.includes('contato')) {
      window.location.replace('./#contato');
    }
  </script>
</head>
<body>
  <div class="notfound-container">
    <div class="notfound-code gradient-text">404</div>
    <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem; font-weight: 700;">Ops! Esse movimento não existe por aqui.</h1>
    <p class="notfound-text">
      A página que você estava procurando foi movida, atualizada ou não existe mais. Retorne à página principal para explorar o portfolio completo.
    </p>
    <a href="./" class="btn btn-primary btn-lg">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Voltar para o Início</span>
    </a>
  </div>
</body>
</html>
